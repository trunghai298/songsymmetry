app = "songsymmetry"
primary_region = "sin"

[build]
[build.args]
NEXT_PUBLIC_EXAMPLE = "Value goes here"

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[vm]]
memory = "1gb"
cpu_kind = "shared"
cpus = 1
